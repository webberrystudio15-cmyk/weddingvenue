<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉLAN — Luxury Indian Wedding Estate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #090807;
    --bg-card: #121110;
    --bg-light: #F4EFE6;
    --text-light: #F7F4EF;
    --text-dark: #161514;
    --text-muted: #9E978E;
    --accent-gold: #C5A059;
    --accent-gold-light: #E6C88B;
    --border-dark: rgba(255, 255, 255, 0.12);
    --border-light: rgba(22, 21, 20, 0.12);
    --font-serif: "Cormorant Garamond", serif;
    --font-sans: "Plus Jakarta Sans", sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background-color: var(--bg-dark);
    color: var(--text-light);
    font-family: var(--font-sans);
    overflow-x: hidden;
}

body::-webkit-scrollbar {
    width: 6px;
}
body::-webkit-scrollbar-thumb {
    background: var(--accent-gold);
}

img, video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

a {
    color: inherit;
    text-decoration: none;
}

/* TYPOGRAPHY & BUTTONS */
.tag {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent-gold);
    display: block;
    margin-bottom: 0.8rem;
}

.section-title {
    font-family: var(--font-serif);
    font-size: clamp(2.5rem, 6vw, 5.8rem);
    font-weight: 300;
    line-height: 0.95;
    margin-bottom: 1.5rem;
}

.section-title em {
    font-style: italic;
    color: var(--accent-gold);
}

.btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 1.1rem 2.2rem;
    background: var(--accent-gold);
    color: var(--bg-dark);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.4s ease;
}

.btn-primary:hover {
    background: var(--accent-gold-light);
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(197, 160, 89, 0.25);
}

.btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 1.1rem 2.2rem;
    background: transparent;
    color: var(--text-light);
    border: 1px solid var(--border-dark);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
}

.btn-outline:hover {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
}

/* NAVIGATION */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 5vw;
    transition: all 0.4s ease;
}

.navbar.scrolled {
    background: rgba(9, 8, 7, 0.95);
    backdrop-filter: blur(16px);
    padding: 1.2rem 5vw;
    border-bottom: 1px solid var(--border-dark);
}

.logo {
    font-family: var(--font-serif);
    font-size: 2.2rem;
    letter-spacing: 0.12em;
    font-weight: 400;
}

.logo span {
    color: var(--accent-gold);
}

.nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

.nav-links a {
    color: var(--text-muted);
    transition: color 0.3s ease;
}

.nav-links a:hover {
    color: var(--accent-gold);
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 1.5rem;
    cursor: pointer;
}

/* MOBILE NAV OVERLAY */
.mobile-nav-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

.mobile-nav-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.mobile-nav-overlay a {
    font-family: var(--font-serif);
    font-size: 2.2rem;
    color: var(--text-light);
}

/* HERO SECTION */
.hero {
    height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 0 5vw 10vh;
}

.hero-bg-video {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(0deg, rgba(9,8,7,0.95) 0%, rgba(9,8,7,0.3) 50%, rgba(9,8,7,0.7) 100%);
}

.hero-content {
    position: relative;
    z-index: 3;
    max-width: 900px;
}

.hero-headline {
    font-family: var(--font-serif);
    font-size: clamp(3.2rem, 8vw, 8.5rem);
    font-weight: 300;
    line-height: 0.88;
    margin-bottom: 2rem;
}

.hero-headline em {
    color: var(--accent-gold);
    font-style: italic;
}

.hero-actions {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
}

/* EXPLORE THE SANCTUARY */
.grounds-horizontal {
    background: #050504;
    position: relative;
    overflow: hidden;
}

.grounds-header {
    padding: 12vh 5vw 4vh;
}

.horizontal-track-wrapper {
    width: 100%;
    overflow: hidden;
}

.horizontal-track {
    display: flex;
    width: max-content;
    padding: 0 5vw 12vh;
    gap: 3vw;
    will-change: transform;
}

.ground-card {
    width: 42vw;
    min-width: 320px;
    height: 65vh;
    flex-shrink: 0;
    background: var(--bg-card);
    border: 1px solid var(--border-dark);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

.ground-card-img {
    height: 72%;
    width: 100%;
    overflow: hidden;
}

.ground-card-img img {
    transition: transform 0.8s ease;
}

.ground-card:hover .ground-card-img img {
    transform: scale(1.06);
}

.ground-card-body {
    padding: 1.8rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-grow: 1;
}

.ground-card-body h3 {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 300;
}

.ground-card-body p {
    color: var(--text-muted);
    font-size: 0.88rem;
    margin-top: 0.4rem;
    max-width: 300px;
}

/* SERVICES SECTION */
.services-video-section {
    position: relative;
    padding: 12vh 5vw;
    overflow: hidden;
}

.services-bg-video {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.services-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: rgba(9, 8, 7, 0.92);
    backdrop-filter: blur(4px);
}

.services-content {
    position: relative;
    z-index: 3;
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2rem;
    margin-top: 3rem;
}

.service-card {
    background: rgba(18, 17, 16, 0.85);
    border: 1px solid var(--border-dark);
    padding: 2.2rem 1.8rem;
    backdrop-filter: blur(10px);
    transition: border-color 0.4s ease, transform 0.4s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 260px;
}

.service-card:hover {
    border-color: var(--accent-gold);
    transform: translateY(-5px);
}

.service-card .num {
    font-family: var(--font-serif);
    font-size: 2.2rem;
    color: var(--accent-gold);
    margin-bottom: 1.2rem;
}

.service-card h4 {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 300;
    margin-bottom: 0.8rem;
}

.service-card p {
    color: var(--text-muted);
    font-size: 0.88rem;
    line-height: 1.7;
}

/* PHOTO & VIDEO GALLERY GRID */
.photo-gallery {
    padding: 12vh 5vw;
    background: var(--bg-dark);
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 1.5rem;
    margin-top: 3rem;
}

.g-item {
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-dark);
    cursor: pointer;
}

.g-item-1 { grid-column: span 8; height: 50vh; }
.g-item-2 { grid-column: span 4; height: 50vh; }
.g-item-v1 { grid-column: span 6; height: 50vh; }
.g-item-v2 { grid-column: span 6; height: 50vh; }
.g-item-3 { grid-column: span 4; height: 55vh; }
.g-item-4 { grid-column: span 4; height: 55vh; }
.g-item-5 { grid-column: span 4; height: 55vh; }
.g-item-6 { grid-column: span 6; height: 45vh; }
.g-item-7 { grid-column: span 6; height: 45vh; }

.g-item img, .g-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.7s ease;
}

.g-item:hover img, .g-item:hover video {
    transform: scale(1.05);
}

.g-item-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 1.2rem;
    background: linear-gradient(0deg, rgba(9,8,7,0.92) 0%, transparent 100%);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent-gold);
    text-transform: uppercase;
    z-index: 2;
    pointer-events: none;
}

/* LIGHTBOX OVERLAY (Hidden by default) */
.lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(9, 8, 7, 0.98);
    z-index: 2000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 5vw;
    cursor: zoom-out;
}

.lightbox-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

.lightbox-content {
    max-width: 90vw;
    max-height: 90vh;
    position: relative;
}

.lightbox-content img,
.lightbox-content video {
    max-width: 100%;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

.lightbox-content video {
    outline: none;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* REVIEWS SECTION */
.reviews-section {
    padding
